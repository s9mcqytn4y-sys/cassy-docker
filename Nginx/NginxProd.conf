user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    # Only cloudflared reaches Nginx (IN1, no published ports). Cloudflare puts the visitor IP in
    # CF-Connecting-IP, so rate limits and logs are per visitor, not per tunnel. Keep in sync with EDGE_SUBNET.
    set_real_ip_from 172.30.0.0/24;
    real_ip_header CF-Connecting-IP;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Bearer tokens in URL paths (receipt, split share, table QR, order tracking) and the WebSocket
    # ticket must not reach access.log (PM-E3). $masked_request_uri and $masked_http_referer replace
    # the token segment with <redacted>; method, route shape and status stay readable.
    map $request_uri $masked_request_uri {
        default $request_uri;
        "~^(?<mask_head>/(?:r|receipts|bagian|order)/)[^/?]+(?<mask_tail>.*)$" "${mask_head}<redacted>${mask_tail}";
        "~^(?<mask_head>/api/v1/public/(?:receipts/short|receipts|split-shares|orders/track|qr)/)[^/?]+(?<mask_tail>.*)$" "${mask_head}<redacted>${mask_tail}";
        "~^(?<mask_head>/ws\?(?:[^#]*&)?ticket=)[^&]+(?<mask_tail>.*)$" "${mask_head}<redacted>${mask_tail}";
    }

    map $http_referer $masked_http_referer {
        default $http_referer;
        "~^(?<mask_head>https?://[^/]+/(?:r|receipts|bagian|order)/)[^/?#]+(?<mask_tail>.*)$" "${mask_head}<redacted>${mask_tail}";
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request_method $masked_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$masked_http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time ut=$upstream_response_time cs=$upstream_cache_status';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:5m rate=10r/s;
    # Staff login brute-force guard (ADR-003 D3, outermost layer).
    limit_req_zone $binary_remote_addr zone=auth_limit:5m rate=10r/m;
    # Public guest routes (decision QR5). One cafe's guests share a Wi-Fi IP, so the budget is per venue.
    limit_req_zone $binary_remote_addr zone=public_limit:10m rate=180r/m;
    limit_req_status 429;
    # Guest menu micro-cache (PWA-08, S5-Q3): a cafe's guests share one NAT IP and fetch the same catalog
    # and CMS. The API's Cache-Control sets the lifetime (catalog 30 s); 5 s when it sends none.
    # proxy_cache_lock lets one request per URL reach the API while the rest wait for the cached copy.
    proxy_cache_path /var/cache/nginx/menu levels=1:2 keys_zone=menu_cache:10m max_size=50m inactive=10m use_temp_path=off;
    limit_req_zone $binary_remote_addr zone=menu_limit:10m rate=1200r/m;

    # Maintenance (N3): `scripts/deploy/SetMaintenance.sh on` creates maintenance/maintenance.on, checked on
    # every request, so no reload is needed. Payment webhooks and health probes always pass through.
    map $uri $maintenance_exempt {
        # volatile: re-evaluate after error_page's internal redirect instead of reusing the first value.
        volatile;
        default 0;
        /api/v1/payments/midtrans/webhook 1;
        ~^/api/v1/payments/midtrans/webhook/ 1;
        ~^/health 1;
        /nginx-health 1;
        # error_page redirects internally and re-runs the server-level check; the page itself must pass.
        ~^/_maintenance\. 1;
    }
    # API and WebSocket clients (POS, KDS) get JSON; browsers get the static page.
    map $uri $maintenance_page {
        default /_maintenance.html;
        ~^/(api|ws)(/|$) /_maintenance.json;
    }
    map $status $retry_after {
        503 120;
        default "";
    }
    map $status $maintenance_cache {
        503 "no-store";
        default "";
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        zone api_backend 64k;
        server api:8080 resolve; # re-resolve after a deploy recreates api (no stale IP, no 502)
        keepalive 32;
    }

    # The web container is optional (W3): resolve it per request through Docker DNS so Nginx starts
    # without it, and answer a short status page while it is absent.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # TLS ends at the Cloudflare edge; the tunnel delivers plain HTTP on the internal edge network (IN1).
    server {
        listen 80;
        server_name _;

        location @web_absent {
            default_type application/json;
            return 503 '{"status":"service_unavailable","service":"Cassy API by AzureDevID","contact":"support@azuredev.id","api":"/api/v1/health"}';
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }

        set $maintenance "";
        if (-f /etc/nginx/maintenance/maintenance.on) {
            set $maintenance "on";
        }
        if ($maintenance_exempt) {
            set $maintenance "";
        }
        if ($maintenance = "on") {
            return 503;
        }
        error_page 503 $maintenance_page;
        location ^~ /_maintenance. {
            internal;
            root /etc/nginx/maintenance;
        }

        # Empty unless the response is 503; nginx skips a header whose value is empty.
        add_header Retry-After $retry_after always;
        add_header Cache-Control $maintenance_cache always;
        add_header X-Served-By "AzureDevID Edge Gateway" always;
        add_header X-Product-Name "Cassy POS Engine" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Next.js injects inline bootstrap scripts; tightening script-src needs per-request nonces.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Midtrans Payment Webhook (no redirect: Midtrans does not follow 3xx; covers both flat & tenant-slug routes)
        location ^~ /api/v1/payments/midtrans/webhook {
            limit_except POST GET HEAD {
                deny all;
            }
            limit_req zone=webhook_limit burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }

        # Guest menu (PWA-08): cached and with its own budget, so 50 guests behind one IP never see 429.
        location ~ ^/api/v1/public/stores/[^/]+/(catalog|cms)$ {
            limit_req zone=menu_limit burst=300 nodelay;
            proxy_cache menu_cache;
            proxy_cache_key $scheme$host$request_uri;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 5s;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;
            proxy_cache_use_stale updating error timeout;
            proxy_cache_background_update on;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 15s;
        }

        # Backend REST API
        # Only the PIN-checking endpoint gets the strict limit; a cafe NATs all tablets behind one IP.
        location /api/v1/public/ {
            limit_req zone=public_limit burst=60 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location ~ ^/api/v1/auth/staff/(login|pin/forgot|pin/forgot-sms|pin/reset-sms|pin/setup)$ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # Health & Readiness Probes
        location /health {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # Realtime WebSocket (KDS, POS, TV Queue)
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Next.js Frontend Application
        location / {
            set $web_frontend http://web:3000;
            proxy_pass $web_frontend;
            proxy_hide_header X-Powered-By;
            proxy_intercept_errors on;
            error_page 502 503 504 = @web_absent;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header traceparent $http_traceparent;
        }
    }
}

