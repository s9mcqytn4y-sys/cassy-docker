# Cassy POS Platform - Automated test stack (Sprint S0, Docs/PRD/PrdOpsAndPwaClose.md section 6)
#
# Throwaway stack for CI and local e2e: Postgres on tmpfs, migrations + development seed
# + the e2e-kasir lifecycle store (db/seeds/E2eLifecycle.sql, when the backend has it),
# the published API image from GHCR, Toxiproxy in front of the API (network fault injection),
# and a virtual ESC/POS printer (escpos-sink). No tunnel, no Nginx, no real secrets.
#
# Host ports (chosen to avoid the demo stack on 8088):
#   18080  API through Toxiproxy (clients and tests use this)
#   8474   Toxiproxy admin API
#   9100   virtual printer (ESC/POS over TCP, Android emulator reaches it at 10.0.2.2:9100)
#   9101   printer job API (GET /jobs, DELETE /jobs)
#   9200   fake Midtrans (tests settle charges: POST /_stub/charges/<order_id>/settle)
#
# Usage:
#   CASSY_BACKEND_DIR=../../CassyBackend docker compose -f Core/DockerComposeTest.yml up -d --wait
#   docker compose -f Core/DockerComposeTest.yml down -v
#
# CASSY_API_IMAGE pins the API build under test (default: latest main from GHCR).
# All credentials below are fixed test values for a disposable database, never reuse them.

name: cassy-test

x-test-db: &test-db
  DB_NAME: cassy_test
  DB_APP_USER: cassy_app
  DB_APP_PASSWORD: cassy-test-app-password

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: cassy_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cassy-test-super-password
      DB_MIGRATOR_USER: cassy_migrator
      DB_MIGRATOR_PASSWORD: cassy-test-migrator-password
      DB_APP_USER: cassy_app
      DB_APP_PASSWORD: cassy-test-app-password
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ../Postgres/InitCassyRoles.sh:/docker-entrypoint-initdb.d/00-init-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cassy_migrator -d cassy_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  migrate:
    image: ${CASSY_API_IMAGE:-ghcr.io/s9mcqytn4y-sys/cassy-api:main}
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *test-db
      APP_ENV: staging
      DATABASE_MIGRATION_URL: postgres://cassy_migrator:cassy-test-migrator-password@postgres:5432/cassy_test?sslmode=disable
      DEMO_OWNER_PIN: "739164"
      DEMO_STAFF_PIN: "528307"
    volumes:
      - ${CASSY_BACKEND_DIR:-../../CassyBackend}/db/seeds:/app/db/seeds:ro
    entrypoint:
      - /bin/sh
      - -c
      - /app/cassy-migrate -action=up -dir=/app/db/migrations && /app/cassy-migrate -action=seed -seed-file=/app/db/seeds/development.sql && /app/cassy-migrate -action=demo-pins -store-slug=central-cafe && if [ -f /app/db/seeds/E2eLifecycle.sql ]; then /app/cassy-migrate -action=seed -seed-file=/app/db/seeds/E2eLifecycle.sql; fi

  api:
    image: ${CASSY_API_IMAGE:-ghcr.io/s9mcqytn4y-sys/cassy-api:main}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      midtrans-stub:
        condition: service_healthy
    environment:
      <<: *test-db
      PORT: "8080"
      APP_ENV: staging
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://cassy_app:cassy-test-app-password@postgres:5432/cassy_test?sslmode=disable
      JWT_SECRET_KEY: cassy-test-only-jwt-signing-value-not-secret
      FRONTEND_URL: http://127.0.0.1:3000
      ALLOWED_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      APP_PUBLIC_URL: http://127.0.0.1:3000
      MIDTRANS_IS_PRODUCTION: "false"
      MIDTRANS_MERCHANT_ID: G000000000
      MIDTRANS_SERVER_KEY: SB-Mid-server-demo-placeholder
      MIDTRANS_CLIENT_KEY: SB-Mid-client-demo-placeholder
      # S4-Q8: every Midtrans call goes to the stub below (the API refuses this in production).
      MIDTRANS_API_BASE_URL: http://midtrans-stub:9200
      EMAIL_DRIVER: log
      SMS_DRIVER: disabled
      WHATSAPP_DRIVER: disabled
      STORAGE_DRIVER: local
      GUEST_SPLIT_ENABLED: "true"
      DEFAULT_STORE_SLUG: central-cafe
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 3s
      timeout: 3s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/ToxiproxyConfig.json"]
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ../Test/ToxiproxyConfig.json:/config/ToxiproxyConfig.json:ro
    ports:
      - "18080:18080"
      # Never toggled by tests: lets a test create orders while cassy_api is cut (S3-Q2).
      - "18081:18081"
      - "8474:8474"
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Cup labels (S4-Q3): the real print agent claims TSPL jobs from the API and prints them on the sink.
  # Built from the backend checkout at start-up; the token matches the e2e seed's label printer.
  print-agent:
    image: golang:1.27-alpine
    working_dir: /src
    command: ["go", "run", "./cmd/print-agent", "-config", "/config/PrintAgentTest.json"]
    environment:
      GOFLAGS: -mod=mod
      CGO_ENABLED: "0"
    volumes:
      - ${CASSY_BACKEND_DIR:-../../CassyBackend}:/src:ro
      - ../Test/PrintAgentTest.json:/config/PrintAgentTest.json:ro
    depends_on:
      api:
        condition: service_healthy
      escpos-sink:
        condition: service_healthy

  escpos-sink:
    image: python:3.12-alpine
    command: ["python", "-u", "/sink/EscposSink.py"]
    volumes:
      - ../Test/EscposSink.py:/sink/EscposSink.py:ro
    ports:
      - "9100:9100"
      - "9101:9101"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/health')"]
      interval: 3s
      timeout: 3s
      retries: 10

  # Fake Midtrans Core API (S4-Q8): charges stay pending until a test settles them, then a webhook
  # signed with the charge's own server key goes to the API, like the real provider.
  midtrans-stub:
    image: python:3.12-alpine
    command: ["python", "-u", "/stub/MidtransStub.py"]
    environment:
      WEBHOOK_URL: http://api:8080/api/v1/payments/midtrans/webhook
    volumes:
      - ../Test/MidtransStub.py:/stub/MidtransStub.py:ro
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/_stub/health')"]
      interval: 3s
      timeout: 3s
      retries: 10
